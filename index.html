<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Learning: ABC & 123</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow-x: hidden;
        }

        .screen {
            display: none;
            min-height: 100vh;
            padding: 20px;
        }

        .screen.active {
            display: flex;
        }

        /* Menu Screen */
        #menuScreen {
            background: linear-gradient(135deg, #a78bfa 0%, #f9a8d4 50%, #fde047 100%);
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .title {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: bold;
            color: white;
            margin-bottom: 30px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            animation: bounce 2s infinite;
            text-align: center;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 500px;
            padding: 0 20px;
        }

        .menu-btn {
            background: linear-gradient(135deg, #3b82f6, #a855f7);
            color: white;
            font-size: clamp(1.2rem, 4vw, 2rem);
            font-weight: bold;
            padding: clamp(20px, 5vw, 40px) clamp(30px, 8vw, 60px);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s;
        }

        .menu-btn:hover {
            transform: scale(1.1) rotate(2deg);
        }

        .menu-btn.green {
            background: linear-gradient(135deg, #10b981, #14b8a6);
        }

        .menu-icons {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            font-size: clamp(2rem, 6vw, 3rem);
        }

        .icon {
            animation: spin 3s infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Learning Screens */
        #abcScreen, #numberScreen {
            flex-direction: column;
        }

        #abcScreen {
            background: linear-gradient(135deg, #93c5fd, #c4b5fd, #f9a8d4);
        }

        #numberScreen {
            background: linear-gradient(135deg, #6ee7b7, #5eead4, #93c5fd);
        }

        .back-btn {
            background: white;
            color: #a855f7;
            padding: clamp(10px, 2vw, 15px) clamp(20px, 4vw, 30px);
            border: none;
            border-radius: 50px;
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            align-self: flex-start;
        }

        .back-btn:hover {
            transform: scale(1.1);
        }

        .score {
            text-align: center;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: bold;
            color: white;
            margin: 20px 0;
        }

        .learning-card {
            background: white;
            border-radius: 30px;
            padding: clamp(30px, 8vw, 60px);
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            transition: transform 0.3s;
        }

        .learning-card:hover {
            transform: scale(1.05);
        }

        .letter-display, .number-display {
            font-size: clamp(4rem, 15vw, 8rem);
            font-weight: bold;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .word-display {
            font-size: clamp(1.5rem, 6vw, 3rem);
            margin-bottom: 30px;
        }

        .number-display {
            background: linear-gradient(135deg, #10b981, #14b8a6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .emoji-display {
            font-size: clamp(2.5rem, 10vw, 5rem);
            margin-bottom: 30px;
        }

        .dots-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(10px, 3vw, 20px);
            margin-bottom: 30px;
            min-height: clamp(120px, 30vw, 200px);
        }

        .dot {
            width: clamp(40px, 8vw, 60px);
            height: clamp(40px, 8vw, 60px);
            background: linear-gradient(135deg, #fbbf24, #f97316);
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            animation: dotBounce 1s infinite;
        }

        @keyframes dotBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .say-btn {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
            font-size: clamp(1.2rem, 3.5vw, 1.8rem);
            font-weight: bold;
            padding: clamp(15px, 4vw, 25px) clamp(30px, 6vw, 50px);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 0 auto;
        }

        .say-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .say-btn.green {
            background: linear-gradient(135deg, #10b981, #14b8a6);
        }

        .nav-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(15px, 4vw, 30px);
            margin-top: 30px;
            padding: 0 20px;
        }

        .nav-btn {
            background: #fbbf24;
            color: white;
            font-size: clamp(1rem, 3vw, 1.5rem);
            font-weight: bold;
            padding: clamp(12px, 3vw, 20px) clamp(25px, 5vw, 40px);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .nav-btn:hover:not(:disabled) {
            transform: scale(1.1);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .nav-btn.next {
            background: #10b981;
        }

        /* Celebration */
        .celebration {
            position: fixed;
            inset: 0;
            pointer-events: none;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .celebration.active {
            display: flex;
        }

        .celebration-emoji {
            font-size: clamp(4rem, 15vw, 8rem);
            animation: ping 1s;
        }

        @keyframes ping {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .star {
            position: absolute;
            font-size: clamp(2rem, 6vw, 4rem);
            animation: floatStar 1.5s ease-out forwards;
        }

        @keyframes floatStar {
            0% { 
                transform: translateY(100vh);
                opacity: 1;
            }
            100% { 
                transform: translateY(-20vh);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Menu Screen -->
    <div id="menuScreen" class="screen active">
        <h1 class="title">🎓 Let's Learn! 🎓</h1>
        <div class="menu-buttons">
            <button class="menu-btn" onclick="showScreen('abc')">
                🔤 Learn ABC
            </button>
            <button class="menu-btn green" onclick="showScreen('123')">
                🔢 Count 1-10
            </button>
        </div>
        <div class="menu-icons">
            <span class="icon">⭐</span>
            <span class="icon" style="animation-delay: 1s;">❤️</span>
            <span class="icon" style="animation-delay: 2s;">✨</span>
        </div>
    </div>

    <!-- ABC Screen -->
    <div id="abcScreen" class="screen">
        <button class="back-btn" onclick="showScreen('menu')">← Back to Menu</button>
        <div class="score">Score: <span id="abcScore">0</span> ⭐</div>
        <div class="learning-card">
            <div class="letter-display" id="letterDisplay">A</div>
            <div class="word-display" id="wordDisplay">🍎 Apple</div>
            <button class="say-btn" onclick="sayLetter()">
                🔊 Say it!
            </button>
        </div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="previousItem('abc')" id="abcPrev">← Previous</button>
            <button class="nav-btn next" onclick="nextItem('abc')" id="abcNext">Next →</button>
        </div>
    </div>

    <!-- Number Screen -->
    <div id="numberScreen" class="screen">
        <button class="back-btn" onclick="showScreen('menu')">← Back to Menu</button>
        <div class="score">Score: <span id="numberScore">0</span> ⭐</div>
        <div class="learning-card">
            <div class="number-display" id="numberDisplay">1</div>
            <div class="emoji-display" id="emojiDisplay">1️⃣</div>
            <div class="dots-container" id="dotsContainer"></div>
            <button class="say-btn green" onclick="sayNumber()">
                🔊 Say it!
            </button>
        </div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="previousItem('123')" id="numPrev">← Previous</button>
            <button class="nav-btn next" onclick="nextItem('123')" id="numNext">Next →</button>
        </div>
    </div>

    <!-- Celebration -->
    <div id="celebration" class="celebration">
        <div class="celebration-emoji">🎉</div>
    </div>

    <script>
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        const alphabetWords = {
            A: '🍎 Apple', B: '🎈 Balloon', C: '🐱 Cat', D: '🐕 Dog', E: '🐘 Elephant',
            F: '🦊 Fox', G: '🦒 Giraffe', H: '🏠 House', I: '🍦 Ice Cream', J: '🤹 Juggle',
            K: '🔑 Key', L: '🦁 Lion', M: '🌙 Moon', N: '🎵 Note', O: '🐙 Octopus',
            P: '🐧 Penguin', Q: '👑 Queen', R: '🌈 Rainbow', S: '⭐ Star', T: '🐯 Tiger',
            U: '☂️ Umbrella', V: '🎻 Violin', W: '🐋 Whale', X: '❌ X-ray', Y: '🧶 Yarn', Z: '🦓 Zebra'
        };
        const numberEmojis = ['1️⃣', '2️⃣', '3️⃣', '4️⃣', '5️⃣', '6️⃣', '7️⃣', '8️⃣', '9️⃣', '🔟'];

        let currentMode = 'menu';
        let currentIndex = 0;
        let abcScore = 0;
        let numberScore = 0;

        function showScreen(mode) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            currentMode = mode;
            currentIndex = 0;

            if (mode === 'menu') {
                document.getElementById('menuScreen').classList.add('active');
            } else if (mode === 'abc') {
                document.getElementById('abcScreen').classList.add('active');
                updateABC();
            } else if (mode === '123') {
                document.getElementById('numberScreen').classList.add('active');
                updateNumber();
            }
        }

        function updateABC() {
            const letter = alphabet[currentIndex];
            document.getElementById('letterDisplay').textContent = letter;
            document.getElementById('wordDisplay').textContent = alphabetWords[letter];
            document.getElementById('abcPrev').disabled = currentIndex === 0;
            document.getElementById('abcNext').disabled = currentIndex === alphabet.length - 1;
        }

        function updateNumber() {
            const number = currentIndex + 1;
            document.getElementById('numberDisplay').textContent = number;
            document.getElementById('emojiDisplay').textContent = numberEmojis[currentIndex];
            
            const container = document.getElementById('dotsContainer');
            container.innerHTML = '';
            for (let i = 0; i < number; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.style.animationDelay = `${i * 0.1}s`;
                container.appendChild(dot);
            }
            
            document.getElementById('numPrev').disabled = currentIndex === 0;
            document.getElementById('numNext').disabled = currentIndex === 9;
        }

        function previousItem(mode) {
            if (currentIndex > 0) {
                currentIndex--;
                if (mode === 'abc') updateABC();
                else updateNumber();
            }
        }

        function nextItem(mode) {
            const maxIndex = mode === 'abc' ? alphabet.length - 1 : 9;
            if (currentIndex < maxIndex) {
                currentIndex++;
                if (mode === 'abc') updateABC();
                else updateNumber();
            }
        }

        function sayLetter() {
            const letter = alphabet[currentIndex];
            const word = alphabetWords[letter].split(' ')[1];
            speak(`${letter}. ${word}`);
            celebrate('abc');
        }

        function sayNumber() {
            const number = currentIndex + 1;
            speak(`${number}`);
            celebrate('123');
        }

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.8;
            utterance.pitch = 1.2;
            window.speechSynthesis.speak(utterance);
        }

        function celebrate(mode) {
            if (mode === 'abc') {
                abcScore++;
                document.getElementById('abcScore').textContent = abcScore;
            } else {
                numberScore++;
                document.getElementById('numberScore').textContent = numberScore;
            }

            const celebration = document.getElementById('celebration');
            celebration.classList.add('active');

            // Create floating stars
            for (let i = 0; i < 12; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.textContent = '⭐';
                star.style.left = `${Math.random() * 100}%`;
                star.style.animationDelay = `${Math.random() * 0.5}s`;
                celebration.appendChild(star);
                
                setTimeout(() => star.remove(), 1500);
            }

            setTimeout(() => {
                celebration.classList.remove('active');
            }, 2000);
        }
    </script>
</body>
</html>
